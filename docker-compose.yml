services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    volumes: ["./data:/data"]
    ports: ["8000:8000"]
  caddy:            # optional automatic HTTPS: docker compose --profile https up -d
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
volumes:
  caddy_data:
