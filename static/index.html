
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAWANSPACE — Collaborative Workspace</title>
<style>
:root{--bg:#fbfbfa;--panel:#f2f2ef;--card:#fff;--tx:#1c2321;--mut:#6c7773;--bd:#e0e2de;--ac:#0f6b5c;--acx:#fff;--hl:#e3f1ed}
[data-t=dark]{--bg:#121615;--panel:#181d1c;--card:#1b2120;--tx:#e6ebe9;--mut:#8b9692;--bd:#2a3230;--ac:#4fc3ad;--acx:#0b1311;--hl:#1d2e2b}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;cursor:pointer;text-decoration:none}button,.btn,select,input{font:inherit;color:var(--tx)}
button,.btn{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
.mut{color:var(--mut)}.sp{flex:1}
#auth{min-height:100vh;align-items:center;justify-content:center;display:flex}
#auth form{width:330px;display:grid;gap:10px}#auth h1{font-size:26px;margin:0 0 4px}
#app{display:none;height:100vh}
#side{width:232px;background:var(--panel);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#side .nav{padding:6px 10px;border-radius:6px;color:var(--mut)}#side .nav:hover{background:var(--hl);color:var(--tx)}
#side .nav.on{background:var(--hl);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
#col{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:10px;padding:10px 20px;border-bottom:1px solid var(--bd);align-items:center}
#q{flex:1;max-width:520px}#main{flex:1;overflow:auto;padding:20px 28px}
h2{margin:0 0 12px;font-size:22px}h3{margin:22px 0 8px;font-size:15px}
.btns{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tbl{border:1px solid var(--bd);border-radius:8px;background:var(--card);overflow:hidden}
.row{display:grid;grid-template-columns:3fr 1.2fr .7fr 1.4fr 1.2fr;padding:8px 12px;border-top:1px solid var(--bd);cursor:pointer;align-items:center;gap:8px}
.row:hover{background:var(--hl)}.row.hd{border-top:0;color:var(--mut);cursor:default;background:var(--panel)}.row.hd:hover{background:var(--panel)}
.row a{margin-right:8px}.row2{padding:6px 0;border-top:1px solid var(--bd)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.bar #ti{font-size:20px;font-weight:600;border:0;background:transparent;min-width:260px}
.tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-bottom:10px}
.cv{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.canvas{min-height:62vh;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:36px 48px;outline:0;line-height:1.7;font-size:15.5px}
.canvas table{border-collapse:collapse;width:100%}.canvas td{border:1px solid var(--bd);padding:6px;min-width:60px}
.canvas pre{background:var(--panel);padding:10px;border-radius:6px;font-family:ui-monospace,Consolas,monospace}
.canvas img{max-width:100%}.canvas.ProseMirror{outline:0}.canvas.ProseMirror p{margin:0 0 1em}.canvas.ProseMirror h1,.canvas.ProseMirror h2,.canvas.ProseMirror h3{line-height:1.25}.canvas.ProseMirror ul,.canvas.ProseMirror ol{padding-left:1.5rem}.canvas.ProseMirror blockquote{border-left:3px solid var(--ac);margin-left:0;padding-left:14px;color:var(--mut)}.canvas.ProseMirror a{color:var(--ac);text-decoration:underline}.canvas.ProseMirror:focus{border-color:var(--ac)}
aside{border:1px solid var(--bd);border-radius:8px;padding:12px;background:var(--card)}aside h4{margin:0 0 8px}
.cm{padding:6px 0;border-top:1px solid var(--bd)}.mn{color:var(--ac)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:12px;font-weight:700;margin-left:-4px;border:2px solid var(--bg)}
#mod{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}
#mod>div{background:var(--bg);border-radius:10px;padding:20px;width:min(560px,92vw);max-height:86vh;overflow:auto}
#mod iframe{width:100%;height:68vh;border:0}#mod img{max-width:100%}
.trow{padding:3px 0}.trow a:hover{color:var(--ac)}
.wsbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:4px 2px 10px}
.wsbox select{width:100%;min-width:0;font-weight:600}
.wsadd{padding:6px 9px;font-weight:700;color:var(--ac);border-color:var(--bd)}
.wslabel{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding-left:4px}

@media(max-width:800px){#side{display:none}.cv{grid-template-columns:1fr}.row{grid-template-columns:2fr 1fr}.row span:nth-child(n+3){display:none}}
.kb{display:flex;gap:12px;align-items:flex-start;overflow:auto;padding-bottom:12px}.kc{min-width:250px;width:250px;background:var(--panel);border-radius:8px;padding:10px;display:grid;gap:8px}
.kh{display:flex;gap:8px;align-items:center}.kh b{flex:1;outline:0}.kd{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px;cursor:grab}.kd:hover{border-color:var(--ac)}
.dt{border-collapse:collapse;width:100%}.dt th,.dt td{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left;white-space:nowrap}.dt input:not([type=checkbox]),.dt select{border:0;background:transparent;width:100%;min-width:110px}
mark{background:var(--hl);color:var(--tx);border-bottom:2px solid var(--ac)}


/* PAWANSPACE File Manager v2 */
.fm-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fm-crumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.fm-crumbs a{color:var(--tx)}.fm-crumbs a:hover{color:var(--ac)}
.fm-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;margin-bottom:14px}
.fm-toolbar input{min-width:180px;flex:1}
.fm-count{font-size:12px;color:var(--mut);white-space:nowrap}
.fm-toggle{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.fm-toggle button{border:0;border-radius:0}.fm-toggle button.active{background:var(--hl);color:var(--ac);font-weight:700}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fm-card{position:relative;min-width:0;border:1px solid var(--bd);border-radius:11px;background:var(--card);padding:14px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.fm-card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 5px 18px #0000000d}
.fm-icon{height:74px;display:grid;place-items:center;border-radius:8px;background:var(--panel);font-size:34px;margin-bottom:12px}
.fm-title{font-weight:650;overflow-wrap:anywhere;line-height:1.35;min-height:38px}
.fm-meta{font-size:12px;color:var(--mut);margin-top:7px;display:flex;flex-direction:column;gap:2px}
.fm-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;padding-top:9px;border-top:1px solid var(--bd)}
.fm-actions a{font-size:12px;padding:3px 6px;border:1px solid var(--bd);border-radius:6px}
.fm-actions a:hover{color:var(--ac);border-color:var(--ac)}
.fm-folder .fm-icon{background:var(--hl)}
.fm-empty{padding:42px 18px;text-align:center;border:1px dashed var(--bd);border-radius:12px;background:var(--card)}
.fm-empty .big{font-size:38px;margin-bottom:8px}
.fm-detail{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:13px}
.fm-detail dt{color:var(--mut)}.fm-detail dd{margin:0;overflow-wrap:anywhere}
.fm-upload-status{font-size:12px;color:var(--ac);min-height:18px;margin:0 0 8px}
@media(max-width:800px){.fm-toolbar input{min-width:100%;}.fm-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.fm-head{align-items:flex-start}}

/* PAWANSPACE real-time collaborative cursors */
.collaboration-carets__caret {
  border-left: 2px solid;
  border-right: 2px solid;
  margin-left: -1px;
  margin-right: -1px;
  pointer-events: none;
  position: relative;
  word-break: normal;
}
.collaboration-carets__label {
  border-radius: 5px 5px 5px 0;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  left: -2px;
  line-height: 1.2;
  padding: 3px 7px;
  position: absolute;
  top: -22px;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  z-index: 20;
}
.collaboration-carets__selection {
  opacity: .22;
}
#pres {
  display: flex;
  align-items: center;
  gap: 3px;
}
.av {
  transition: transform .18s ease;
}
.av:hover {
  transform: translateY(-2px);
}



/* PAWANSPACE UI/UX refinement v1 — visual layer only; application logic unchanged */
:root{
 --bg:#f6f8fb;--panel:#f0f3f8;--card:#ffffff;--tx:#17212f;--mut:#68778a;
 --bd:#e3e9f1;--ac:#3659d9;--acx:#ffffff;--hl:#edf1ff;
 --shadow:0 8px 24px rgba(25,42,70,.06);--shadow-lg:0 18px 55px rgba(25,42,70,.13);
 --radius:14px;
}
[data-t=dark]{
 --bg:#0d1320;--panel:#131d2c;--card:#172235;--tx:#e9eef8;--mut:#9ba9bf;
 --bd:#28364c;--ac:#8da4ff;--acx:#111a2a;--hl:#202d4a;
 --shadow:0 8px 24px rgba(0,0,0,.16);--shadow-lg:0 18px 55px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.005em}
button,.btn,input,select{transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}
button,.btn{border-radius:10px;padding:8px 13px;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.035)}
button:hover,.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
button.pri{box-shadow:0 5px 14px color-mix(in srgb,var(--ac) 22%,transparent)}
button.pri:hover{filter:brightness(1.06)}
input,select{border-radius:10px;padding:9px 12px;min-height:38px}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 14%,transparent)}
#auth{background:radial-gradient(ellipse at 15% 15%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 38%),radial-gradient(ellipse at 85% 85%,rgba(35,170,150,.10),transparent 34%),var(--bg);padding:24px}
#auth form{width:min(420px,100%);padding:38px;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--shadow-lg);gap:14px}
#auth h1{font-size:30px;letter-spacing:-.04em;font-weight:800;color:var(--tx)}
#auth form>span.mut{font-size:14px;line-height:1.6;margin-bottom:8px}
#auth input{width:100%;min-height:46px}
#auth button{min-height:44px}
#app{background:var(--bg)}
#side{width:258px;flex:0 0 258px;padding:20px 14px;background:var(--card);border-right:1px solid var(--bd);gap:5px;box-shadow:2px 0 12px rgba(20,35,60,.025);z-index:2}
.wsbox{padding:5px 3px 18px;gap:8px}
.wslabel{font-size:10px;font-weight:800;letter-spacing:.13em;padding:0 8px;color:var(--mut)}
.wsbox select{min-height:42px;border-radius:11px;background:var(--panel);border-color:transparent;font-size:13px}
.wsadd{border-radius:11px;min-width:42px;font-size:18px}
#side .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);transition:all .16s ease}
#side .nav:hover{background:var(--panel);color:var(--tx);transform:translateX(2px)}
#side .nav.on{background:var(--hl);color:var(--ac);font-weight:750;box-shadow:inset 3px 0 var(--ac)}
#side .sp{min-height:18px}
#side>.mut{font-size:12px!important;padding:12px 10px 5px!important;border-top:1px solid var(--bd);margin-top:12px}
#top{min-height:70px;padding:12px 30px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);gap:10px;position:sticky;top:0;z-index:4}
#q{max-width:620px;min-height:42px;background:var(--panel);border-color:transparent;padding-left:15px}
#top button{min-height:40px}
#main{padding:30px clamp(20px,3.2vw,48px) 48px;max-width:1600px;width:100%;margin:0 auto}
h2{font-size:26px;line-height:1.25;letter-spacing:-.035em;font-weight:780;margin:0 0 18px}
h3{font-size:15px;letter-spacing:-.01em;font-weight:750;margin:28px 0 12px}
.mut{color:var(--mut)}
.btns{gap:9px;margin-bottom:18px}
.tbl{border:1px solid var(--bd);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.row{min-height:52px;padding:11px 16px;gap:12px;border-top:1px solid var(--bd);font-size:13px}
.row:first-child{border-top:0}
.row:hover{background:var(--hl)}
.row.hd{min-height:42px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--panel)}
.row span:first-child{font-weight:650;overflow-wrap:anywhere}
.row a{display:inline-flex;align-items:center;justify-content:center;min-width:27px;min-height:27px;border-radius:7px}
.row a:hover{background:var(--hl);color:var(--ac)}
.row2{padding:10px 12px;border-top:1px solid var(--bd)}
.bar{gap:10px;margin-bottom:14px}
.bar #ti{font-size:22px;font-weight:750;letter-spacing:-.025em;min-height:42px}
.tb{padding:8px;gap:6px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px}

.fm-toolbar{padding:14px;border-radius:14px;box-shadow:var(--shadow);gap:10px}
.fm-card{border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(15,23,42,.025)}
.fm-card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.fm-icon{height:82px;border-radius:11px}

.kc{border:1px solid var(--bd);border-radius:13px;padding:12px}

@media(max-width:680px){
 #app{height:100dvh;flex-direction:column}
 #side{width:100%;height:auto;flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:5px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}

 #side .sp,#side>.mut{display:none}

 #q{min-width:80px;font-size:12px}

 #main{padding:18px 13px 30px}
 h2{font-size:22px}.row{grid-template-columns:minmax(0,2fr) minmax(0,1fr);padding:10px 11px}.row span:nth-child(n+3){display:none}
 .fm-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
 #auth form{padding:26px 22px}
}


/* PAWANSPACE Dashboard V2 — subtle futuristic motion */
#main{position:relative;isolation:isolate;background:linear-gradient(145deg,rgba(245,248,255,.92),rgba(248,250,255,.96) 48%,rgba(244,248,255,.92))}
[data-t=dark] #main{background:linear-gradient(145deg,#111827,#131b2c 55%,#111827)}
#main:before{content:"";position:fixed;z-index:-1;inset:60px 0 0 232px;pointer-events:none;background:radial-gradient(circle at 78% 14%,rgba(76,120,255,.10),transparent 27%),radial-gradient(circle at 40% 70%,rgba(31,190,173,.07),transparent 30%);animation:ambientDrift 18s ease-in-out infinite alternate}
@keyframes ambientDrift{0%{transform:translate3d(-1%,0,0) scale(1)}100%{transform:translate3d(1.2%,1%,0) scale(1.035)}}
.dash-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;min-height:218px;padding:30px 36px;margin:0 0 20px;border:1px solid rgba(132,158,220,.22);border-radius:22px;color:#fff;background:linear-gradient(112deg,#172c59 0%,#254b9a 48%,#466de0 100%);box-shadow:0 18px 45px rgba(42,75,150,.16)}
.dash-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.08) 48%,transparent 70%);transform:translateX(-100%);animation:heroShimmer 9s ease-in-out infinite;pointer-events:none}
@keyframes heroShimmer{0%,55%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}
.dash-hero-copy{position:relative;z-index:2}.dash-eyebrow{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:800;letter-spacing:.17em;color:#c8d8ff}.pulse-dot,.live-badge i{width:7px;height:7px;border-radius:50%;background:#53e2c0;box-shadow:0 0 0 4px rgba(83,226,192,.14);animation:pulseGlow 2.4s infinite}
@keyframes pulseGlow{50%{box-shadow:0 0 0 8px rgba(83,226,192,0)}}
.dash-hero h2{font-size:clamp(25px,3vw,34px);letter-spacing:-.035em;margin:12px 0 5px;color:#fff}.dash-hero p{margin:0;color:#d7e3ff;font-size:14px}.dash-quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:21px}.dash-quick button{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.10);color:#fff;backdrop-filter:blur(8px);padding:9px 14px;border-radius:10px}.dash-quick button.pri{background:#fff;color:#24489b;border-color:#fff}.dash-quick button:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}.dash-quick button.pri:hover{background:#edf2ff}

<script>

// Safely tear down the previous document connection before navigating.
function closeSock(){
  if(sock){
    try{
      sock.onopen=null;
      sock.onmessage=null;
      sock.onerror=null;
      sock.onclose=null;
      if(sock.readyState===WebSocket.OPEN || sock.readyState===WebSocket.CONNECTING){
        sock.close(1000,'PAWANSPACE navigation');
      }
    }catch(e){console.warn('WebSocket cleanup:',e)}
    sock=null;
  }

  // Destroy the previous Yjs/Tiptap session, if one is active.
  try{
    if(window.PAWANSPACECRDT &&
       typeof window.PAWANSPACECRDT.destroy==='function'){
      window.PAWANSPACECRDT.destroy();
    }
  }catch(e){console.warn('CRDT cleanup:',e)}

  crdtEditor=null;
  crdtProvider=null;
  crdtDoc=null;
  crdtStartingId=null;
}
let cmdTimer=null,cmdResults=[],globalSearchText='';

async function api(p,m='GET',b){const fd=b instanceof FormData;const r=await fetch('/api'+p,{method:m,headers:{Authorization:'Bearer '+T,...(b&&!fd?{'Content-Type':'application/json'}:{})},body:fd?b:b&&JSON.stringify(b)});
 if(!r.ok){if(r.status==401&&ME){logout()}let e=await r.json().catch(()=>({}));throw new Error(e.detail||r.statusText)}return r.json()}

async function go(v){
 if(cur&&view=='editor')await flush();

  sharedItems=[];

async function loadDashboardExtras(){

 // non-admin users retain the permission-filtered recent-item fallback already rendered.

   const auditRows=await api(`/ws/${encodeURIComponent(W.id)}/audit`);

    panel.innerHTML=(head?head.outerHTML:'')+body;
   }

// Replace the existing preview(i) function with this one.

function preview(i) {
    if (!i) return;

    const ext = String(i.title || '')
        .split('.')
        .pop()
        .toLowerCase();

    const previewable = [
        'xlsx',
        'docx',
        'pptx',
        'csv',
        'txt',
        'md',
        'json',
        'log',
        'xml'
    ];

    const downloadUrl =
        `/api/items/${encodeURIComponent(i.id)}/download?token=${encodeURIComponent(T||'')}`;

    const downloadLink = `
        <a class="btn" href="${downloadUrl}&dl=1">
            Download
        </a>
    `;

    // Office documents and text-based files
    if (previewable.includes(ext)) {

        mod(`<h3>${esc(i.title || 'File preview')}</h3><p class="mut">Preparing preview…</p>`);
        return api(`/items/${encodeURIComponent(i.id)}/preview`)
            .then(d => {

                mod(`
                    <h3>${esc(i.title || 'File preview')}</h3>

                    <div style="
                        overflow:auto;
                        max-height:66vh;
                        padding:12px;
                    ">
                        ${typeof d?.html==='string' ? d.html : '<p>Nothing to preview.</p>'}
                    </div>

                    <div class="btns" style="margin-top:14px">
                        ${downloadLink}
                    </div>
                `);

            })
            .catch(fail);
    }

    // Image, PDF and other file previews
    const mime = String(i.mime || '').toLowerCase();

    let body = '';

    if (mime.startsWith('image/')) {

        body = `
            <img
                src="${downloadUrl}"
                alt="${esc(i.title || 'Image')}"
                style="
                    max-width:100%;
                    max-height:65vh;
                    object-fit:contain;
                "
            >
        `;

    } else if (
        mime === 'application/pdf' ||
        ext === 'pdf'
    ) {

        body = `
            <iframe
                src="${downloadUrl}"
                title="${esc(i.title || 'PDF preview')}"
                style="
                    width:100%;
                    height:65vh;
                    border:0;
                "
            ></iframe>
        `;

    } else if (mime.startsWith('text/')) {

        body = `
            <iframe
                src="${downloadUrl}"
                title="${esc(i.title || 'Text preview')}"
                style="
                    width:100%;
                    height:65vh;
                    border:0;
                "
            ></iframe>
        `;

    } else {

        body = `
            <p class="mut">
                Preview is not available for this format.
                Download the file to open it.
            </p>
        `;
    }

    mod(`
        <h3>${esc(i.title || 'File preview')}</h3>

        ${body}

        <div class="btns" style="margin-top:14px">
            ${downloadLink}
        </div>
    `);
}

function imgPick(input){
  // The editor toolbar uses the existing hidden #ii input. If called without
  // an argument, open that picker instead of creating a second picker.
  const picker=input || $('#ii');
  if(!picker)return;

  if(!input){
    picker.click();
    return;
  }

  const file=picker.files && picker.files[0];
  if(!file)return;

  // Reset the input so selecting the same image again triggers onchange.
  picker.value='';

  if(!file.type || !file.type.startsWith('image/')){
    alert('Please select a valid image.');
    return;
  }
  if(file.size>2*1024*1024){
    alert('Image size must be below 2 MB.');
    return;
  }

  const editor=crdtEditor || window.PAWANSPACECRDT?.editor;
  if(!editor){
    alert('Collaborative editor is not ready. Please wait for the document to connect.');
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    const src=reader.result;
    if(typeof src!=='string' || !src.startsWith('data:image/')){
      alert('The selected image could not be processed.');
      return;
    }
    try{
      const inserted=editor.chain().focus().setImage({
        src,
        alt:file.name || 'Document image',
        title:file.name || ''
      }).run();
      if(!inserted)alert('Could not insert this image at the current cursor position.');
      updateDocStats();
    }catch(e){
      console.error('Image insertion failed:',e);
      alert('Image insertion failed: '+(e.message||e));
    }
  };
  reader.onerror=()=>{
    console.error('Image file read failed:',reader.error);
    alert('Unable to read the selected image.');
  };
  reader.readAsDataURL(file);
}

async function upl(el){
 const fs=[...el.files];el.value='';if(!fs.length)return;
 const parent=view==='files'&&cwd?cwd:'',status=$('#fm-upload-status');let ok=0,failed=[];
 for(let n=0;n<fs.length;n++){
  const f=fs[n];if(status)status.textContent=`Uploading ${n+1} of ${fs.length}: ${f.name}`;
  const fd=new FormData();fd.append('f',f);
  try{await api(`/upload?ws=${encodeURIComponent(W.id)}&parent=${encodeURIComponent(parent)}`,'POST',fd);ok++}
  catch(e){failed.push(`${f.name}: ${e.message}`)}
 }
 await reload();
 if(view!=='files'){cwd=parent||null;view='files'}
 render();
 const message=`${ok} of ${fs.length} file(s) uploaded successfully.`+(failed.length?` Failed: ${failed.join(' | ')}`:'');
 const statusNow=$('#fm-upload-status');if(statusNow)statusNow.textContent=message;
 if(failed.length)alert(message);
}

function dataEditor(){const ro=cur.perm!='edit';return `<div class="bar"><a onclick="back()" title="Back">←</a><input id="ti" value="${esc(cur.title)}" ${ro?'disabled':''} onchange="rn(this.value)"><span id="st" class="mut">${ro?'View only':'Saved'}</span><span class="sp"></span><span id="pres"></span>${cur.kind=='database'?'<button onclick="csv()">Export CSV</button>':''}<button onclick="share()">Share</button><button onclick="hist()">History</button></div><div id="bd">${cur.kind=='board'?boardHtml():dbHtml()}</div>`}

function boardHtml(){const ro=cur.perm!='edit';return `<div class="kb">${cur.data.columns.map(c=>`<div class="kc" ondragover="event.preventDefault()" ondrop="drop(event,'${c.id}')"><div class="kh"><b ${ro?'':`contenteditable onblur="colT('${c.id}',this.textContent)"`}>${esc(c.title)}</b><span class="mut">${c.cards.length}</span>${ro?'':`<a onclick="delCol('${c.id}')" title="Delete column">✕</a>`}</div>${c.cards.map(k=>`<div class="kd" draggable="${!ro}" ondragstart="event.dataTransfer.setData('text/plain','${k.id}')" onclick="editCard('${k.id}')"><div>${esc(k.t)}</div><small class="mut">${esc(k.a||'')}${k.due?' · '+esc(k.due):''}</small></div>`).join('')}${ro?'':`<button onclick="addCard('${c.id}')">+ Add card</button>`}</div>`).join('')}${ro?'':`<button onclick="addCol()">+ Add column</button>`}</div>`}
const findCard=id=>{for(const c of cur.data.columns){const i=c.cards.findIndex(k=>k.id==id);if(i>=0)return[c,i]}};
function drop(e,col){e.preventDefault();if(cur.perm!='edit')return;const f=findCard(e.dataTransfer.getData('text/plain'));if(!f)return;const k=f[0].cards.splice(f[1],1)[0];cur.data.columns.find(x=>x.id==col).cards.push(k);touch()}
function addCard(col){const t=prompt('Card title');if(!t)return;cur.data.columns.find(x=>x.id==col).cards.push({id:uid(),t});touch()}

function editCard(id){const f=findCard(id);if(!f)return;const k=f[0].cards[f[1]],ro=cur.perm!='edit',d=ro?'disabled':'';mod(`<h3>Card</h3><div style="display:grid;gap:8px"><input id="kt" value="${esc(k.t)}" ${d}><textarea id="kds" rows="4" ${d} placeholder="Description" style="background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px">${esc(k.d||'')}</textarea><select id="ka" ${d}><option value="">Unassigned</option>${MEM.filter(m=>m.id).map(m=>`<option ${k.a==m.name?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input id="kdue" type="date" value="${esc(k.due||'')}" ${d}></div>${ro?'':`<div class="btns" style="margin-top:10px"><button class="pri" onclick="saveCard('${id}')">Save card</button><button onclick="delCard('${id}')">Delete card</button></div>`}`)}
function saveCard(id){const f=findCard(id),k=f[0].cards[f[1]];k.t=$('#kt').value.trim()||k.t;k.d=$('#kds').value;k.a=$('#ka').value;k.due=$('#kdue').value;closeMod();touch()}

/* ---- database (table + board views) ---- */
function dbHtml(){const ro=cur.perm!='edit';return `<div class="btns"><input id="dbf" placeholder="Filter rows…" value="${esc(DV.f)}" oninput="DV.f=this.value;$('#dbb').innerHTML=dbBody()"><select onchange="DV.v=this.value;redraw()"><option value="table" ${DV.v=='table'?'selected':''}>Table view</option><option value="board" ${DV.v=='board'?'selected':''}>Board view</option></select>${ro?'':`<button onclick="addRow()">+ New row</button><button onclick="colMenu()">+ New column</button>`}</div><div id="dbb">${dbBody()}</div>`}
function dbBody(){const d=cur.data,ro=cur.perm!='edit';let rows=d.rows.filter(r=>!DV.f||Object.values(r.c).join(' ').toLowerCase().includes(DV.f.toLowerCase()));
 if(DV.s){const t=(d.cols.find(c=>c.id==DV.s.c)||{}).type;rows=[...rows].sort((a,b)=>{let x=a.c[DV.s.c]??'',y=b.c[DV.s.c]??'';if(t=='number'){x=+x;y=+y}return(x>y?1:x<y?-1:0)*DV.s.d})}
 if(DV.v=='board'){const g=d.cols.find(c=>c.type=='select');if(!g)return '<p class="mut">Add a column of type “select” to use board view.</p>';const nm=d.cols[0];
  return `<div class="kb">${[...(g.options||[]),''].map(o=>`<div class="kc" data-o="${esc(o)}" ondragover="event.preventDefault()" ondrop="dbDrop(event,'${g.id}',this.dataset.o)"><div class="kh"><b>${esc(o||'No value')}</b></div>${rows.filter(r=>(r.c[g.id]||'')==o).map(r=>`<div class="kd" draggable="${!ro}" ondragstart="event.dataTransfer.setData('text/plain','${r.id}')">${esc(r.c[nm.id]||'Untitled')}</div>`).join('')}</div>`).join('')}</div>`}
 return `<div class="tbl" style="overflow:auto"><table class="dt"><tr>${d.cols.map(c=>`<th><a onclick="d_s('${c.id}')">${esc(c.name)}${DV.s&&DV.s.c==c.id?(DV.s.d>0?' ▲':' ▼'):''}</a>${ro?'':` <a class="mut" onclick="colMenu('${c.id}')">⋯</a>`}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${d.cols.map(c=>`<td>${cell(r,c,ro)}</td>`).join('')}<td>${ro?'':`<a onclick="delRow('${r.id}')" title="Delete row">✕</a>`}</td></tr>`).join('')}</table></div>${rows.length?'':'<p class="mut" style="padding:8px">No rows yet. Use “New row”.</p>'}`}
function cell(r,c,ro){const v=r.c[c.id]??'',a=`onchange="setCell('${r.id}','${c.id}',${c.type=='checkbox'?'this.checked':'this.value'})"`,dis=ro?'disabled':'';
 if(c.type=='checkbox')return `<input type="checkbox" ${v?'checked':''} ${a} ${dis}>`;
 if(c.type=='select')return `<select ${a} ${dis}><option value=""></option>${(c.options||[]).map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 return `<input type="${c.type=='number'?'number':c.type=='date'?'date':'text'}" value="${esc(v)}" ${a} ${dis}>`}
function setCell(rid,cid,v){cur.data.rows.find(x=>x.id==rid).c[cid]=v;chg()}

function saveCol(id){const n=$('#cn').value.trim();if(!n)return;const o={name:n,type:$('#ct').value,options:$('#co').value.split(',').map(x=>x.trim()).filter(Boolean)};if(id)Object.assign(cur.data.cols.find(x=>x.id==id),o);else cur.data.cols.push({id:uid(),...o});closeMod();touch()}
